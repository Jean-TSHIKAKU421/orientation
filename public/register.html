<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Guide des filières</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Orientation Informatique</h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Changer le mode d'affichage" title="Basculer mode clair/sombre">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
            </button>
        </div>
    </header>

    <main>
        <section class="form-container">
            <h2>Créer un compte</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="nom">Nom complet *</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="matricule">Matricule *</label>
                    <input type="text" id="matricule" name="matricule" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse email (optionnel)</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" aria-label="Afficher le mot de passe">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">S'inscrire</button>
            </form>
            <p class="message" id="form-message"></p>
            <p class="login-link">Déjà inscrit ? <a href="/login">Se connecter</a></p>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
